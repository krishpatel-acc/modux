[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modux"
version = "0.1.0"
description = "A cross-platform AI terminal assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Krish Patel" }
]

dependencies = [
    "groq>=0.20.0",
    "keyring>=25.0.0"
]

[project.scripts]
modux = "modux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]